info:
  name: Ping
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:5000/api/ping
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200 with a message", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().message).to.equal("Hello World");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Health check. Needs no login.
